services:
  - type: web
    name: sbrai-solutions-api
    runtime: docker
    plan: free

    # Environment variables
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stack
      - key: QUEUE_CONNECTION
        value: database

    # If you want to use Render's managed PostgreSQL, uncomment below:
    # env:
    #   - fromGroup: postgresql

    # Docker configuration
    docker:
      file: Dockerfile

    # Port configuration
    port: 8000

    # Build command (optional - if needed)
    # buildCommand: "composer install && npm install && npm run build"

    # Health check endpoint
    healthCheckPath: /

databases:
  # Uncomment to use Render's PostgreSQL (note: would need to change Laravel config)
  # - name: sbrai-db
  #   plan: free
  #   ipAllowList: []

envVarGroups:
